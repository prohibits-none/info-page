<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            font-family: 'Gilroy',sans-serif;
            background-color: #000000;
        }
        input{
            display: block;
            background-color: #000000;
            color: white;
            border: 1px solid rgb(110, 108, 108);
            background-color: #2a2828;
        }
        ::placeholder{
            color: rgb(191, 189, 189);
        }

        #main{
            /* display: flex;
            align-items: center;
            justify-content: center; */
            padding-left: 20px;
        }
        #kutta2{
            margin-top: 5px;
            margin-right: -50px;
            /* display: flex;
            align-items: flex-end;
            justify-content: flex-end; */
            
        }
        .card{
            margin-top: 20px;
            /* height: 70px; */
            width: 300px;
            background-color: #2b2b2b;
            border-radius: 10px;
            display: inline-block;
            /* align-items: flex-start;
            justify-content: center; */
            color: white;
            /* margin-left: 50px; */
        }
        .card h5{
            padding-left: 5px;
        }
        .card p{
            margin-top: 20px;
            font-size: 12px;
            /* padding-left: 5px; */
            padding-bottom: 10px;
        }
        .profile{

            margin-top: 11px;
            margin-bottom: 15px;
            height: 50px;
            width: 50px;
            background-color: #2a2828;
            border-radius: 35px;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* border-radius: 30px; */
        }
        #paddings {
            padding-left: 5px;
        }
        .f9-mode {
            background: black;
            color: white;
            }

/* Whatever changes you want */

}

</head>

    <div id="main">
        <form action="">
            <input type="text" placeholder="profile_pic: ">            
            <input type="text" placeholder="name: ">
            <input type="text" placeholder="occupation: ">
            <input type="text" placeholder="info: ">
            <input id = "kutta2" type="submit">
